global:
  models: ["gcn", "gat", "graphsage"]
  seeds: [0]
  split: "test"
  # Target selection constraints
  attack_only_illicit: true
  only_clean_correct: true
  attack_fraction: 1.0  # Attack all valid targets in test set

sweeps:
  - attack: gnia
    params:
      BUDGET: [1, 5, 10, 20, 30, 40, 50]
      EPOCHS: [20]  # Fixed epochs
